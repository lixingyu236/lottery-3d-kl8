name: diagnose-sources

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Count kl8 zoushi rows with different params
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          count_rows() {
            local desc="$1"; local url="$2"
            code=$(curl -sS -o /tmp/p.html -w "%{http_code}" --max-time 40 -A "$UA" -H "Referer: https://datachart.500.com/" "$url" 2>/dev/null || echo "ERR")
            size=$(wc -c < /tmp/p.html 2>/dev/null || echo 0)
            rows=$(grep -c 'chartBall01' /tmp/p.html 2>/dev/null || echo 0)
            periods=$(grep -oE '<td align="center">[0-9]{7}' /tmp/p.html 2>/dev/null | wc -l)
            echo "KL8ROWS|$desc|http=$code|bytes=$size|balls=$rows|periods=$periods"
          }
          count_rows "default" "https://datachart.500.com/kl8/zoushi/jbzs_redblue.shtml"
          count_rows "expect100" "https://datachart.500.com/kl8/zoushi/jbzs_redblue.shtml?expect=100"
          count_rows "expectall_range" "https://datachart.500.com/kl8/zoushi/jbzs_redblue.shtml?expect=all&from=2026042&to=2026291"
          count_rows "expectall_range2" "https://datachart.500.com/kl8/zoushi/jbzs_redblue.shtml?expect=all&from=2026042&to=2026291&jumpsrc=/kl8/zoushi/"
          rm -f /tmp/p.html