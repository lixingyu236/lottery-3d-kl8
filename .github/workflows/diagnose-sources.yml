name: diagnose-sources

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Count kl8 zoushi rows with different params
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          for desc_url in \
            "default|https://datachart.500.com/kl8/zoushi/jbzs_redblue.shtml" \
            "expect100|https://datachart.500.com/kl8/zoushi/jbzs_redblue.shtml?expect=100" \
            "expectall|https://datachart.500.com/kl8/zoushi/jbzs_redblue.shtml?expect=all&from=2026042&to=2026291" \
            "expect200|https://datachart.500.com/kl8/zoushi/jbzs_redblue.shtml?expect=200"
          do
            desc="${desc_url%%|*}"
            url="${desc_url#*|}"
            curl -sS -o /tmp/p.html -w "" --max-time 30 -A "$UA" "$url"
            size=$(wc -c < /tmp/p.html)
            rows=$(grep -oE '<tr>\s*<td align="center">[0-9]{7}' /tmp/p.html | wc -l)
            balls=$(grep -o 'chartBall01' /tmp/p.html | wc -l)
            echo "KL8ROWS|$desc|bytes=$size|rows=$rows|balls=$balls"
          done