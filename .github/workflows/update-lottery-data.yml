name: update-lottery-data

# 每天 北京时间 21:35 / 22:10 两次尝试（福彩3D/快乐8 约 21:15 开奖）
# 也支持在 GitHub 仓库 Actions 页面手动运行（Run workflow 按钮）
on:
  schedule:
    - cron: '35 13 * * *'
    - cron: '10 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-lottery-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Fetch latest draw data
        run: python scripts/fetch_lottery_data.py --output data/lottery_data.json

      - name: Regenerate webpage
        run: python scripts/generate_webpage.py --input data/lottery_data.json --output index.html

      - name: Commit and push if changed
        run: |
          git config user.name "lottery-updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/lottery_data.json
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
          else
            git commit -m "auto: update lottery data $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi